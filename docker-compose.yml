# ezPos SaaS production stack. Copy .env.production.example to .env first.
# TLS is terminated by the nginx edge (see nginx/ezpos.conf + certbot).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ezpos}
      POSTGRES_USER: ${POSTGRES_USER:-ezpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ezpos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./ezPosBackend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ezpos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ezpos}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      NODE_ENV: production
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ezpos.com,https://app.ezpos.com}
      APP_URL: ${APP_URL:-https://ezpos.com}
      BACKEND_URL: ${BACKEND_URL:-https://api.ezpos.com}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sslcommerz}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      STOREFRONT_RATE_LIMIT_PER_MINUTE: ${STOREFRONT_RATE_LIMIT_PER_MINUTE:-600}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SSLCOMMERZ_SANDBOX: ${SSLCOMMERZ_SANDBOX:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      # Hosted storefront platform
      STOREFRONT_BASE_DOMAIN: ${STOREFRONT_BASE_DOMAIN:-ezpos.store}
      STOREFRONT_RENDERER_TOKEN: ${STOREFRONT_RENDERER_TOKEN:?set STOREFRONT_RENDERER_TOKEN in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ezpos-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://cdn.ezpos.store}
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-10}
    # Migrations run once via: docker compose run --rm backend npm run db:migrate

  # S3-compatible object storage for storefront media. Swappable for
  # Cloudflare R2 / AWS S3 later by pointing S3_* env vars at the provider.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ezpos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Browser uploads from the portal go directly to MinIO via presigned
      # PUT; this CORS allowance is what makes that possible.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-https://ezpos.com}
    volumes:
      - minio-data:/data
    # Public reads go through the CDN host (caddy cdn.ezpos.com → :9000).

  # One-shot bucket bootstrap (creates the media bucket if missing).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD) do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET:-ezpos-media};
      mc anonymous set download local/$${S3_BUCKET:-ezpos-media} || true;
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ezpos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-ezpos-media}

  # Hosted storefront renderer (tenant websites).
  storefront:
    build:
      context: ./ezPosStorefront
      args:
        BACKEND_URL: http://backend:3000
        STOREFRONT_RENDERER_TOKEN: ${STOREFRONT_RENDERER_TOKEN:?set STOREFRONT_RENDERER_TOKEN in .env}
        NEXT_PUBLIC_STOREFRONT_BASE_DOMAIN: ${STOREFRONT_BASE_DOMAIN:-ezpos.store}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000
      STOREFRONT_RENDERER_TOKEN: ${STOREFRONT_RENDERER_TOKEN}
      NEXT_PUBLIC_STOREFRONT_BASE_DOMAIN: ${STOREFRONT_BASE_DOMAIN:-ezpos.store}

  # Edge: automated TLS for the platform AND every tenant domain
  # (wildcard *.ezpos.store via DNS-01, custom domains via on-demand TLS).
  # Replaces the nginx+certbot edge; nginx/ezpos.conf is kept for rollback.
  caddy:
    build:
      context: ./caddy
      args:
        DNS_PLUGIN: ${CADDY_DNS_PLUGIN:-github.com/caddy-dns/cloudflare}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      TLS_ASK_TOKEN: ${STOREFRONT_RENDERER_TOKEN:?set STOREFRONT_RENDERER_TOKEN in .env}
      CLOUDFLARE_DNS_API_TOKEN: ${DNS_PROVIDER_API_TOKEN:?set DNS_PROVIDER_API_TOKEN in .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - website
      - pos
      - backend
      - storefront
      - minio

  website:
    build:
      context: ./ezPosWebsite
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_ORIGIN:-https://api.ezpos.com}
        NEXT_PUBLIC_POS_URL: ${POS_ORIGIN:-https://app.ezpos.com}
        NEXT_PUBLIC_SITE_URL: ${SITE_ORIGIN:-https://ezpos.com}
        API_BASE_URL: http://backend:3000
    restart: unless-stopped
    depends_on:
      - backend

  pos:
    build:
      context: ./pos
      args:
        VITE_API_URL: ${API_ORIGIN:-https://api.ezpos.com}/api
        VITE_WEBSITE_URL: ${SITE_ORIGIN:-https://ezpos.com}
    restart: unless-stopped

volumes:
  pgdata:
  certbot-webroot:
  certbot-certs:
  minio-data:
  caddy-data:
  caddy-config:
